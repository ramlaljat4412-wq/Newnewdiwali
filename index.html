            const [cart, setCart] = useState([]);
            const [loginDetails, setLoginDetails] = useState({ name: '', phone: '' });
            const [selectedProduct, setSelectedProduct] = useState(null);
            
            const [address, setAddress] = useState({ house: '', area: '', city: '', state: '', pin: '', primaryPhone: '', altPhone: '' });
            const [selectedSizes, setSelectedSizes] = useState({});
            const [showPopup, setShowPopup] = useState(false);
            const [couponInput, setCouponInput] = useState('');
            const [isCouponApplied, setIsCouponApplied] = useState(false);
            
            const [activeCategory, setActiveCategory] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');

            const DELIVERY_FEE = 20;
            const WHATSAPP_NUMBER = "918018929965";

            useEffect(() => {
                if (currentView === 'splash') {
                    const timer = setTimeout(() => { setCurrentView('login'); }, 2500); 
                    return () => clearTimeout(timer);
                }
            }, [currentView]);

            const handleSizeChange = (productId, size) => setSelectedSizes(prev => ({ ...prev, [productId]: size }));

            const openProductDetail = (product) => {
                setSelectedProduct(product);
                if (!selectedSizes[product.id]) {
                    let defaultSize = 'M';
                    if (['saree', 'lehenga'].includes(product.category)) defaultSize = 'Free Size';
                    else if (product.category === 'shoes') defaultSize = '8';
                    handleSizeChange(product.id, defaultSize);
                }
                setCurrentView('pdp');
                window.scrollTo(0,0);
            };

            const addToCart = (e, product, directCheckout = false) => {
                if(e) { e.preventDefault(); e.stopPropagation(); }

                let defaultSize = 'M';
                if (['saree', 'lehenga'].includes(product.category)) defaultSize = 'Free Size';
                else if (product.category === 'shoes') defaultSize = '8';

                const size = selectedSizes[product.id] || defaultSize; 
                
                setCart(prev => {
                    const existingIndex = prev.findIndex(item => item.id === product.id && item.size === size);
                    if (existingIndex >= 0) {
                        const newCart = [...prev];
                        newCart[existingIndex] = { ...newCart[existingIndex], quantity: newCart[existingIndex].quantity + 1 };
                        return newCart;
                    }
                    return [...prev, { ...product, quantity: 1, size: size }];
                });
                
                if (directCheckout) { setCurrentView('cart'); window.scrollTo(0,0); } 
                else { setShowPopup(true); setTimeout(() => setShowPopup(false), 3500); }
            };

            const updateQuantity = (id, size, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id && item.size === size) {
                        const newQ = item.quantity + delta;
                        return newQ > 0 ? { ...item, quantity: newQ } : item;
                    }
                    return item;
                }).filter(item => item.quantity > 0));
            };

            const handleApplyCoupon = () => {
                if(couponInput.trim().toUpperCase() === 'DIWALI100') {
                    setIsCouponApplied(true);
                } else {
                    alert("Invalid or Expired Coupon Code!");
                }
            };

            const totals = useMemo(() => {
                let totalItems = 0;
                cart.forEach(item => { totalItems += item.quantity; });
                
                const rawTotal = totalItems * 200; 
                
                const groupsOf3 = Math.floor(totalItems / 3);
                const remainder = totalItems % 3;
                const itemsTotal = (groupsOf3 * 500) + (remainder * 200); 

                const discount = rawTotal - itemsTotal;
                
                let finalTotal = itemsTotal > 0 ? itemsTotal + DELIVERY_FEE : 0;
                if(isCouponApplied && finalTotal > 100) {
                    finalTotal -= 100;
                }

                return { rawTotal, itemsTotal, discount, finalTotal, itemCount: totalItems };
            }, [cart, isCouponApplied]);

            const handleWhatsAppOrder = () => {
                let text = "Hello OLN Brands! I would like to place an order.\n\n";
                text += "🛍️ *ORDER DETAILS:*\n";
                cart.forEach((item, index) => {
                    text += `${index + 1}. ${item.name}\n   - Size: ${item.size}\n   - Qty: ${item.quantity}\n   - Price: ₹${item.price * item.quantity}\n`;
                });
                
                text += `\n💰 *BILLING SUMMARY:*\n`;
                text += `- Items Total: ₹${totals.rawTotal}\n`;
                if(totals.discount > 0) text += `- Combo Discount: -₹${totals.discount}\n`;
                if(isCouponApplied) text += `- Coupon (DIWALI100): -₹100\n`;
                text += `- Delivery Fee: ₹${DELIVERY_FEE}\n`;
                text += `*Final Amount to Pay: ₹${totals.finalTotal}*\n\n`;

                text += `📍 *DELIVERY ADDRESS:*\n`;
                text += `- Name: ${loginDetails.name}\n`;
                text += `- Primary Phone: ${address.primaryPhone}\n`;
                if(address.altPhone) text += `- Alt Phone: ${address.altPhone}\n`;
                text += `- House/Flat: ${address.house}\n`;
                text += `- Area/Street: ${address.area}\n`;
                text += `- City & State: ${address.city}, ${address.state}\n`;
                text += `- Pincode: ${address.pin}\n\n`;
                
                text += "Please share the UPI payment details so I can confirm my order.";

                const encodedText = encodeURIComponent(text);
                window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodedText}`, '_blank');
            };

            const renderBottomNav = () => (
                <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center py-2 z-40 max-w-md mx-auto text-[10px] font-medium text-gray-500 pb-3">

                    </div>
                    <form onSubmit={(e) => { e.preventDefault(); setCurrentView('payment'); }} className="bg-white p-4 mt-2 space-y-4 shadow-sm border-y border-gray-200">
                        <div className="flex items-center gap-2 mb-4 text-sm font-bold text-gray-800 border-b border-gray-100 pb-2">
                            <i className="fa-solid fa-location-dot meesho-text-pink"></i> Contact & Location
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            <div className="col-span-2">
                                <label className="text-[11px] uppercase font-bold text-gray-500">Contact Number (Primary)</label>
                                <input type="tel" required value={address.primaryPhone} onChange={e => setAddress({...address, primaryPhone: e.target.value.replace(/[^0-9]/g, '')})} maxLength="10" className="w-full border-b border-gray-300 py-2 text-sm focus:border-[#9f2089] outline-none font-bold text-gray-800" />
                            </div>
                            <div className="col-span-2">
                                <label className="text-[11px] uppercase font-bold text-gray-500">Alternative Phone Number</label>
                                <input type="tel" required value={address.altPhone} onChange={e => setAddress({...address, altPhone: e.target.value.replace(/[^0-9]/g, '')})} maxLength="10" className="w-full border-b border-gray-300 py-2 text-sm focus:border-[#9f2089] outline-none font-bold text-gray-800" placeholder="Family member's number" />
                            </div>
                            <div className="col-span-2 mt-2">
                                <label className="text-[11px] uppercase font-bold text-gray-500">House no./ Building Name</label>
                                <input type="text" required value={address.house} onChange={e => setAddress({...address, house: e.target.value})} className="w-full border-b border-gray-300 py-2 text-sm focus:border-[#9f2089] outline-none" />
                            </div>
                            <div className="col-span-2">
                                <label className="text-[11px] uppercase font-bold text-gray-500">Road Name, Area, Colony</label>
                                <input type="text" required value={address.area} onChange={e => setAddress({...address, area: e.target.value})} className="w-full border-b border-gray-300 py-2 text-sm focus:border-[#9f2089] outline-none" />
                            </div>
                            <div>
                                <label className="text-[11px] uppercase font-bold text-gray-500">Pincode</label>
                                <input type="text" required value={address.pin} onChange={e => setAddress({...address, pin: e.target.value.replace(/[^0-9]/g, '')})} maxLength="6" className="w-full border-b border-gray-300 py-2 text-sm focus:border-[#9f2089] outline-none" />
                            </div>
                            <div>
                                <label className="text-[11px] uppercase font-bold text-gray-500">City</label>
                                <input type="text" required value={address.city} onChange={e => setAddress({...address, city: e.target.value})} className="w-full border-b border-gray-300 py-2 text-sm focus:border-[#9f2089] outline-none" />
                            </div>
                        </div>
                        <div className="bottom-checkout-bar">
                            <div className="text-left w-full mr-4">
                                <p className="text-[10px] text-gray-500 font-bold uppercase">Deliver to:</p>
                                <p className="text-sm font-bold text-gray-800 line-clamp-1">{loginDetails.name || 'User'}</p>
                            </div>
                            <button type="submit" className="meesho-pink text-white font-bold py-2.5 px-6 rounded text-sm w-full shadow-md">Proceed to Payment</button>
                        </div>
                    </form>
                </div>
            );

            // 6. WHATSAPP PAYMENT PAGE
            const renderPayment = () => (
                <div className="min-h-screen bg-gray-100 flex flex-col">
                    <div className="bg-white p-4 flex items-center gap-4 border-b border-gray-200 sticky top-0 z-40">
                        <i className="fa-solid fa-arrow-left text-lg cursor-pointer" onClick={() => setCurrentView('address')}></i>
                        <h2 className="text-base font-bold text-gray-800 flex-1 uppercase tracking-wide">Complete Your Order</h2>
                    </div>
                    
                    <div className="p-4 flex-1">
                        <div className="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm p-6 text-center mt-4">
                            <div className="w-20 h-20 bg-green-100 rounded-full mx-auto flex items-center justify-center mb-5 border-4 border-white shadow-md">
                                <i className="fa-brands fa-whatsapp text-5xl text-green-500"></i>
                            </div>
                            <p className="font-black text-gray-800 text-xl mb-3">Secure Payment via WhatsApp</p>
                            <p className="text-sm text-gray-600 font-medium leading-relaxed mb-6">
                                To ensure a secure transaction and confirm your product availability, we process payments directly through our official WhatsApp support. Click the button below to instantly share your order details with our agent.
                            </p>
                            
                            <div className="bg-gray-50 rounded-lg p-4 mb-6 border border-gray-200 text-left">
                                <p className="text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-2">Order Summary</p>
                                <div className="flex justify-between items-center text-sm font-bold text-gray-800">
                                    <span>Total Amount to Pay:</span>
                                    <span className="text-xl text-green-600">₹{totals.finalTotal}</span>
                                </div>
                            </div>
                            
                            <button 
                               onClick={handleWhatsAppOrder} 
                               className="block w-full bg-[#25D366] text-white font-black py-4 rounded-xl text-center text-base shadow-lg tracking-wide hover:bg-[#128C7E] transition transform hover:-translate-y-0.5"
                            >
                                <i className="fa-brands fa-whatsapp mr-2 text-xl align-middle"></i> Place Order via WhatsApp
                            </button>
                        </div>
                    </div>
                </div>
            );

            // 7. CATEGORIES PAGE
            const renderCategories = () => (
                <div className="min-h-screen bg-gray-50 pb-20">
                    <div className="bg-white p-4 border-b border-gray-200 sticky top-0 z-40 shadow-sm flex items-center gap-3">
                        <h2 className="text-base font-bold text-gray-800">CATEGORIES</h2>
                    </div>
                    <div className="p-3 grid grid-cols-2 gap-3 mt-2">
                        {categoryList.map(cat => (
                            <div key={cat.id} className="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden flex flex-col items-center justify-center p-3 cursor-pointer hover:shadow-md transition" onClick={() => { setActiveCategory(cat.id); setCurrentView('category_products'); window.scrollTo(0,0); }}>
                                <div className="w-20 h-20 rounded-full overflow-hidden border border-gray-200 mb-2">
                                    <img src={cat.img} className="w-full h-full object-cover" />
                                </div>
                                <p className="text-xs font-bold text-center text-gray-700 leading-tight">{cat.title}</p>
                            </div>
                        ))}
                    </div>
                    {renderBottomNav()}
                </div>
            );

            // 8. CATEGORY SPECIFIC PRODUCTS PAGE
            const renderCategoryProducts = () => {
                const categoryData = categoryList.find(c => c.id === activeCategory);
                const title = categoryData ? categoryData.title : 'Products';
                const filteredProducts = products.filter(p => p.category === activeCategory);

                return (
                    <div className="min-h-screen bg-gray-50 pb-20">
                        <div className="bg-white p-4 border-b border-gray-200 sticky top-0 z-40 shadow-sm flex items-center gap-3">
                            <i className="fa-solid fa-arrow-left text-lg cursor-pointer text-gray-700" onClick={() => setCurrentView('categories')}></i>
                            <h2 className="text-base font-bold text-gray-800 flex-1 truncate">{title}</h2>
                            <div className="relative cursor-pointer" onClick={() => setCurrentView('cart')}>
                                <i className="fa-solid fa-cart-shopping text-gray-700"></i>
                                {totals.itemCount > 0 && <span className="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">{totals.itemCount}</span>}
                            </div>
                        </div>
                        {renderProductGrid(filteredProducts)}
                        {renderBottomNav()}
                    </div>
                );
            };

            const renderOrders = () => (
                <div className="min-h-screen bg-gray-50 pb-20">
                    <div className="bg-white p-4 border-b border-gray-200 sticky top-0 z-40 shadow-sm flex items-center gap-3"><h2 className="text-base font-bold text-gray-800">MY ORDERS</h2></div>
                    <div className="p-8 text-center mt-10 bg-white m-4 rounded shadow-sm border"><p className="font-bold text-gray-600">No orders found</p></div>
                    {renderBottomNav()}
                </div>
            );
            
            const renderAccount = () => (
                <div className="min-h-screen bg-gray-50 pb-20">
                    <div className="bg-white p-4 flex items-center gap-4 border-b border-gray-200 sticky top-0 z-40 shadow-sm">
                        <i className="fa-solid fa-arrow-left text-lg cursor-pointer text-gray-600" onClick={() => setCurrentView('home')}></i>
                        <h2 className="text-base font-bold text-gray-800 flex-1">ACCOUNT</h2>
                        <i className="fa-solid fa-cart-shopping text-gray-600 cursor-pointer" onClick={() => setCurrentView('cart')}></i>
                    </div>
                    
                    <div className="bg-white p-4 mb-2 flex items-center gap-4 border-b border-gray-200 cursor-pointer hover:bg-gray-50">
                        <div className="w-16 h-16 bg-pink-100 rounded-full flex items-center justify-center text-[#9f2089] text-3xl border border-pink-200">
                            <i className="fa-solid fa-user"></i>
                        </div>
                        <div>
                            <h3 className="font-bold text-lg text-gray-800">{loginDetails.name || 'User'}</h3>
                            <p className="text-gray-500 text-sm font-medium">+91 {loginDetails.phone || '9876543210'}</p>
                        </div>
                        <i className="fa-solid fa-chevron-right ml-auto text-gray-400"></i>
                    </div>

                    <div className="flex bg-white py-4 px-4 mb-2 border-y border-gray-200 gap-4">
                        <div className="flex-1 border border-gray-200 rounded-lg p-3 flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-gray-50">
                            <i className="fa-solid fa-headset text-blue-500 text-xl"></i>
                            <span className="text-sm font-bold text-gray-700">Help Centre</span>
                        </div>
                        <div className="flex-1 border border-gray-200 rounded-lg p-3 flex flex-col items-center justify-center gap-2 cursor-pointer hover:bg-gray-50">
                            <i className="fa-solid fa-language text-purple-500 text-xl"></i>
                            <span className="text-sm font-bold text-gray-700">Change Language</span>
                        </div>
                    </div>

                    <div className="bg-white px-4 py-2 mb-2 border-y border-gray-200">
                        <p className="font-bold text-gray-800 mb-2 text-sm">My Payments</p>
                        <div className="flex items-center gap-4 py-3 border-b border-gray-100 cursor-pointer">
                            <i className="fa-solid fa-building-columns text-blue-500 text-lg w-5 text-center"></i> 
                            <span className="font-medium text-sm text-gray-700">Bank & UPI Details</span>
                        </div>
                        <div className="flex items-center gap-4 py-3 cursor-pointer">
                            <i className="fa-regular fa-credit-card text-blue-500 text-lg w-5 text-center"></i> 
                            <span className="font-medium text-sm text-gray-700">Payments & Refunds</span>
                        </div>
                    </div>

                    <div className="bg-white px-4 py-2 border-y border-gray-200 mb-8 mt-2">
                        <p className="font-bold text-gray-800 mb-2 text-sm">My Activity</p>
                        <div className="flex items-center gap-4 py-3 border-b border-gray-100 cursor-pointer">
                            <i className="fa-solid fa-heart text-red-500 text-lg w-5 text-center"></i> 
                            <span className="font-medium text-sm text-gray-700">Wishlisted Products</span>
                        </div>
                        <div className="flex items-center gap-4 py-3 border-b border-gray-100 cursor-pointer">
                            <i className="fa-solid fa-share-nodes text-purple-500 text-lg w-5 text-center"></i> 
                            <span className="font-medium text-sm text-gray-700">Shared Products</span>
                        </div>
                        <div className="flex items-center gap-4 py-3 cursor-pointer text-red-500" onClick={() => { setLoginDetails({name:'', phone:''}); setCurrentView('login'); }}>
                            <i className="fa-solid fa-arrow-right-from-bracket text-lg w-5 text-center"></i> 
                            <span className="font-bold text-sm">Sign Out</span>
                        </div>
                    </div>
                    {renderBottomNav()}
                </div>
            );

            return (
                <div className="max-w-md mx-auto min-h-screen bg-gray-50 shadow-xl relative overflow-x-hidden font-sans">
                    {currentView === 'splash' && renderSplash()}
                    {currentView === 'login' && renderLogin()}
                    {currentView === 'home' && renderHome()}
                    {currentView === 'pdp' && renderProductDetail()}
                    {currentView === 'categories' && renderCategories()}
                    {currentView === 'category_products' && renderCategoryProducts()}
                    {currentView === 'orders' && renderOrders()}
                    {currentView === 'account' && renderAccount()}
                    {currentView === 'cart' && renderCart()}
                    {currentView === 'address' && renderAddress()}
                    {currentView === 'payment' && renderPayment()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
